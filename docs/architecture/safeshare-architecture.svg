<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1310 575" role="img" lang="en" aria-labelledby="archify-diagram-title archify-diagram-description" data-animation="trace" data-preset="blueprint" data-theme="dark" data-quality-profile="showcase">
  <title id="archify-diagram-title">SafeShare for Box — Zero-PII Client-Side Scrubber, Redactor &amp; ShareRadar Process Architecture</title>
